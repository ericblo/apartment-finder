<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floor Plan Editor</title>
  <link rel="stylesheet" href="floorplan.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <a class="nav-link" href="../apartments/apartments.html">&larr; Your apartments</a>
      <div class="detail-header-row">
        <div>
          <h1 id="apartment-title">Floor Plan</h1>
          <p class="subtitle">Drag a room to move it, a corner/edge to resize it. Click a label to rename, click a room to select it. Edits save automatically.</p>
        </div>
        <button type="button" id="delete-apartment" class="delete-button">Delete apartment</button>
      </div>
    </header>

    <div class="toolbar">
      <button type="button" id="edit-toggle">Enable editing</button>
      <button type="button" id="cleanup-layout">Clean up layout</button>
      <button type="button" id="add-room" disabled>Add room</button>
      <button type="button" id="delete-room" class="delete-button" disabled>Delete room</button>
      <span class="status" id="status" aria-live="polite"></span>
    </div>

    <div class="canvas-wrap" id="canvas-wrap">
      <svg id="floorplan-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../apartments/apartments-data.js"></script>
  <script src="floorplan.js"></script>
</body>
</html>
